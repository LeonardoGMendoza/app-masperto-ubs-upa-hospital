  <body>
    <div id="erro-debug" style="position:fixed;top:0;left:0;right:0;background:red;color:white;padding:10px;font-size:14px;z-index:99999;white-space:pre-wrap;display:none;"></div>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var el = document.getElementById('erro-debug');
        el.style.display = 'block';
        el.innerText = 'ERRO: ' + msg + '\nLinha: ' + line + '\nArquivo: ' + url;
      };
      window.addEventListener('unhandledrejection', function(event) {
        var el = document.getElementById('erro-debug');
        el.style.display = 'block';
        el.innerText = 'ERRO (promise): ' + event.reason;
      });
    </script>
    <div id="root"></div>
  </body>
